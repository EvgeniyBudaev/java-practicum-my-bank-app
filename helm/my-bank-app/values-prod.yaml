global:
  namespace: prod
  imagePullPolicy: IfNotPresent

  keycloak:
    issuerUri: http://localhost:30088/realms/bank
    jwkSetUri: http://keycloak:8080/realms/bank/protocol/openid-connect/certs
    tokenUri: http://keycloak:8080/realms/bank/protocol/openid-connect/token

postgres:
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

kafka:
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

keycloak:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

accounts:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

cash:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

