apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-zipkin-test
  labels:
    app: zipkin
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: zipkin-test
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          wget -qO- --timeout=10 http://zipkin:{{ .Values.service.port }}/health | grep -q '"status"'
  restartPolicy: Never
