apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kibana
  labels:
    app: kibana
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: kibana
        release: {{ .Release.Name }}
    spec:
      initContainers:
        - name: wait-for-elasticsearch
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until wget -qO- http://elasticsearch:{{ .Values.elasticsearch.service.port }}/_cluster/health 2>/dev/null | grep -q '"status"'; do
                echo "Elasticsearch not ready, retrying in 5s..."
                sleep 5
              done
              echo "Elasticsearch is ready."
      containers:
        - name: kibana
          image: "{{ .Values.kibana.image.repository }}:{{ .Values.kibana.image.tag }}"
          imagePullPolicy: {{ .Values.kibana.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.kibana.service.port }}
              name: http
          volumeMounts:
            - name: kibana-config
              mountPath: /usr/share/kibana/config/kibana.yml
              subPath: kibana.yml
          readinessProbe:
            httpGet:
              path: /api/status
              port: {{ .Values.kibana.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: {{ .Values.kibana.service.port }}
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.kibana.resources | nindent 12 }}
      volumes:
        - name: kibana-config
          configMap:
            name: {{ .Release.Name }}-kibana-config
