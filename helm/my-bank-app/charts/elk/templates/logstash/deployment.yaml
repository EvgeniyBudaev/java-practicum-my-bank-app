apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-logstash
  labels:
    app: logstash
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logstash
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: logstash
        release: {{ .Release.Name }}
    spec:
      initContainers:
        - name: wait-for-elasticsearch
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until wget -qO- http://elasticsearch:{{ .Values.elasticsearch.service.port }}/_cluster/health 2>/dev/null | grep -q '"status"'; do
                echo "Elasticsearch not ready, retrying in 5s..."
                sleep 5
              done
              echo "Elasticsearch is ready."
      containers:
        - name: logstash
          image: "{{ .Values.logstash.image.repository }}:{{ .Values.logstash.image.tag }}"
          imagePullPolicy: {{ .Values.logstash.image.pullPolicy }}
          ports:
            - containerPort: 9600
              name: api
          env:
            - name: LS_JAVA_OPTS
              value: "-Xms128m -Xmx128m"
          volumeMounts:
            - name: logstash-config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: logstash-config
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: logstash.conf
          readinessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 9600
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.logstash.resources | nindent 12 }}
      volumes:
        - name: logstash-config
          configMap:
            name: {{ .Release.Name }}-logstash-config
