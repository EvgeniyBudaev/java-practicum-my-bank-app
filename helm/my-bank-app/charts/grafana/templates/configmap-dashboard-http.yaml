apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-dashboard-http
  labels:
    app: grafana
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
data:
  http-metrics.json: |
    {
      "id": null,
      "uid": "bank-http-metrics",
      "title": "Bank App - HTTP Metrics",
      "tags": ["bank", "http"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "RPS (Requests per Second)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (application)",
              "legendFormat": "{{ "{{" }}application{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "lineWidth": 2 } }
          }
        },
        {
          "id": 2,
          "title": "5xx Error Rate",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[1m])) by (application)",
              "legendFormat": "{{ "{{" }}application{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "color": { "fixedColor": "red", "mode": "fixed" }, "custom": { "lineWidth": 2 } }
          }
        },
        {
          "id": 3,
          "title": "4xx Error Rate",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"4..\"}[1m])) by (application)",
              "legendFormat": "{{ "{{" }}application{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "color": { "fixedColor": "orange", "mode": "fixed" }, "custom": { "lineWidth": 2 } }
          }
        },
        {
          "id": 4,
          "title": "Request Latency - p50 / p95 / p99",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket[5m])) by (application, le))",
              "legendFormat": "p50 {{ "{{" }}application{{ "}}" }}"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (application, le))",
              "legendFormat": "p95 {{ "{{" }}application{{ "}}" }}"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[5m])) by (application, le))",
              "legendFormat": "p99 {{ "{{" }}application{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "lineWidth": 2 } }
          }
        },
        {
          "id": 5,
          "title": "Request Count by Status Code",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (application, status)",
              "legendFormat": "{{ "{{" }}application{{ "}}" }} HTTP {{ "{{" }}status{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "lineWidth": 1 } }
          }
        }
      ]
    }
