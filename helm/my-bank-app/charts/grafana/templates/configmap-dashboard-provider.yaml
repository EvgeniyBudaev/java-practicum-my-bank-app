apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-dashboard-provider
  labels:
    app: grafana
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
data:
  provider.yml: |
    apiVersion: 1
    providers:
      - name: bank-app-dashboards
        folder: Bank App
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
