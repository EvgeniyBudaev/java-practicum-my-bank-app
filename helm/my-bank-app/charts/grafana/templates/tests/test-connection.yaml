apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-grafana-test
  labels:
    app: grafana
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: grafana-test
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          wget -qO- --timeout=10 http://grafana:{{ .Values.service.port }}/api/health | grep -q '"database"'
  restartPolicy: Never
