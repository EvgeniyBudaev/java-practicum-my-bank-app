apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-dashboard-business
  labels:
    app: grafana
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
data:
  business-metrics.json: |
    {
      "id": null,
      "uid": "bank-business-metrics",
      "title": "Bank App - Business Metrics",
      "tags": ["bank", "business"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Failed Withdrawals — Trend",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(increase(bank_cash_withdrawal_failed_total[10m]))",
              "legendFormat": "Total"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "lineWidth": 2 } }
          }
        },
        {
          "id": 2,
          "title": "Failed Withdrawals — Total Rate",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(increase(bank_cash_withdrawal_failed_total[1h]))",
              "legendFormat": "Last 1h"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "red", "value": 20 }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "title": "Failed Transfers — Total Rate",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "expr": "sum(increase(bank_transfer_failed_total[1h]))",
              "legendFormat": "Last 1h"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "red", "value": 20 }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Failed Transfers by Step",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(increase(bank_transfer_failed_total[10m])) by (step)",
              "legendFormat": "step: {{ "{{" }}step{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "lineWidth": 2 } }
          }
        },
        {
          "id": 5,
          "title": "Failed Transfers — Trend",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(increase(bank_transfer_failed_total[10m]))",
              "legendFormat": "Total"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "custom": { "lineWidth": 2 } }
          }
        },
        {
          "id": 6,
          "title": "Notification Send Failures by Type",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "sum(increase(bank_notification_send_failed_total[10m])) by (type)",
              "legendFormat": "type: {{ "{{" }}type{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "fixedColor": "red", "mode": "fixed" },
              "custom": { "lineWidth": 2 }
            }
          }
        },
        {
          "id": 7,
          "title": "Notification Failures — Total",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "sum(increase(bank_notification_send_failed_total[1h]))",
              "legendFormat": "Last 1h"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        }
      ]
    }
