apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-prometheus-test
  labels:
    app: prometheus
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: prometheus-test
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          wget -qO- --timeout=10 http://prometheus:{{ .Values.service.port }}/-/healthy | grep -q "Prometheus"
  restartPolicy: Never
